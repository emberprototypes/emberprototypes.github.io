<!doctype html><html lang="en"><head><link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Montserrat"><title>Camera XY Calibration</title><link rel="icon" type="image/x-icon" href="/images/favicon.ico"><style> body{font-family: "Montserrat"; text-align: center;} button{font-family: "Montserrat"; text-align: center;} #videoContainer{position: relative; margin: auto; width: 500px; height: 375px; border-style: double; overflow: hidden;} #videoStream{width: 100%; height: 100%; background-color: #000000; object-fit: cover; object-position: center;} #crosshairOverlay{position: absolute; width: 100px; height: 100px; left: 200px; top: 137.5px;} </style></head><body><a href="https://www.emberprototypes.com/products/cxc" target="_blank"><img src="../images/Black Logo.png" alt="Ember background" class="center" style="max-width: 400px; min-width: 400px;"><br><hr style="width: 500px; height: 5px; background-color: #e6e6e6; border-width: 0;"><br></a><h2 style="font-weight: 1000;">Camera Assisted XY Offset Calibration</h2><a href="https://drive.google.com/file/d/1kBHQkrujYlfWvHdGmklLLmi-EM_ri_2X/view" target="_blank">Click here for user manual & troubleshooting</a><br><br><br><div id="videoContainer"><video autoplay="true" id="videoStream"></video><img id="crosshairOverlay" src="../images/Crosshair.png" alt="Image crosshair"></div><br><button onClick="zoomIn()">&nbsp;&nbsp;&nbsp;Zoom In&nbsp;&nbsp;</button>&nbsp; <button onClick="zoomOut()">Zoom Out</button><br><br><input style="width: 200px;" onclick="exposureHandler()" id="exposureSlider" type="range" min="0" max="20" value="10"><br><br><button id="startButton" onClick="startHandler()" style="font-size: larger;">&nbsp;&nbsp;Start XY Cal&nbsp;&nbsp;</button>&nbsp;&nbsp; <button id="startButtonZ" onClick="startHandlerZ()" style="font-size: larger;">&nbsp;&nbsp;Start Z Cal&nbsp;&nbsp;</button>&nbsp;&nbsp; <button id="backButton" onClick="backHandler()" style="font-size: larger;" disabled>&nbsp;&nbsp;Back&nbsp;&nbsp;</button>&nbsp;&nbsp; <button id="resetButton" onClick="resetHandler()" style="font-size: larger;" disabled>&nbsp;&nbsp;Reset&nbsp;&nbsp;</button><br><br><p id="textBox" style="font-size: smaller; border-style: double; max-width: 600px; min-width: 600px; min-height: 150px; position: relative; margin: auto; padding-top: 25px;"></p><br><form><p style="font-weight: 600;"> X0: <input type="number" name="x0" id="x0" step="0.01" value="" onchange="setTwoNumberDecimal(this)">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; Y0: <input type="number" name="y0" id="y0" step="0.01" value="" onchange="setTwoNumberDecimal(this)">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; Z0: <input type="number" name="z0" id="z0" step="0.01" value="" onchange="setTwoNumberDecimal(this)"><br><br> X1: <input type="number" name="x1" id="x1" step="0.01" value="" onchange="setTwoNumberDecimal(this)">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; Y1: <input type="number" name="y1" id="y1" step="0.01" value="" onchange="setTwoNumberDecimal(this)">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; Z1: <input type="number" name="z1" id="z1" step="0.01" value="" onchange="setTwoNumberDecimal(this)"><br><br> X2: <input type="number" name="x2" id="x2" step="0.01" value="" onchange="setTwoNumberDecimal(this)">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; Y2: <input type="number" name="y2" id="y2" step="0.01" value="" onchange="setTwoNumberDecimal(this)">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; Z2: <input type="number" name="z2" id="z2" step="0.01" value="" onchange="setTwoNumberDecimal(this)"><br><br> X3: <input type="number" name="x3" id="x3" step="0.01" value="" onchange="setTwoNumberDecimal(this)">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; Y3: <input type="number" name="y3" id="y3" step="0.01" value="" onchange="setTwoNumberDecimal(this)">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; Z3: <input type="number" name="z3" id="z3" step="0.01" value="" onchange="setTwoNumberDecimal(this)"><br><br> X4: <input type="number" name="x4" id="x4" step="0.01" value="" onchange="setTwoNumberDecimal(this)">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; Y4: <input type="number" name="y4" id="y4" step="0.01" value="" onchange="setTwoNumberDecimal(this)">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; Z4: <input type="number" name="z4" id="z4" step="0.01" value="" onchange="setTwoNumberDecimal(this)"><br></p></form><form><br><hr style="width: 500px; height: 5px; background-color: #e6e6e6; border-width: 0;"><br><p style="font-weight: 600;"> X: <input type="text" id="calibrationX" name="calibrationX" readonly>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; Y: <input type="text" id="calibrationY" name="calibrationY" readonly>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; Z: <input type="text" id="calibrationZ" name="calibrationZ" readonly><br><br><br></p></form><a style="font-size: smaller;" href="mailto:info@emberprototypes.com">Ember Prototypes - 2026</a><script> function findCamera(deviceInfos) { var cxcDeviceID = null; var video = document.querySelector("#videoStream"); for (let i = 0; i < deviceInfos.length; i++) { const deviceInfo = deviceInfos[i]; debugOutput(deviceInfo.label); debugOutput(deviceInfo.deviceId); if ((deviceInfo.label.includes("HD Camera") || deviceInfo.label.includes("1e45:8022")) && !deviceInfo.label.includes("FaceTime") || deviceInfo.label.includes("Ember CXC USB Camera") || deviceInfo.label.includes("Webcam")) { cxcDeviceID = deviceInfo.deviceId; navigator.mediaDevices.getUserMedia({video: {deviceId: {exact: cxcDeviceID}, width: {min: 1280, ideal:1920}, height: {min: 720, ideal:1080}}}) .then(function (stream) {video.srcObject = stream;}) .catch(function (videoStreamError) {debugOutput("Error streaming video")}); break; } } if (cxcDeviceID == null) { debugOutput("Could not find the CXC Camera",cxcDeviceID); alert("Could not find the CXC Camera!"); } } async function cameraConnect() { if (navigator.mediaDevices.getUserMedia) { debugOutput("Attempting to get permissions, enumerate, and connect to CXC camera..."); const temp = await navigator.mediaDevices.getUserMedia({ video: true }); temp.getTracks().forEach(t => t.stop()); navigator.mediaDevices.enumerateDevices().then(findCamera) .catch(function (enumerateError) {debugOutput("Error enumerating or connecting to devices")}); } } function debugOutput(text) { console.log(text); } function calculateOffsets() { debugOutput("Calculating offsets..."); var x0 = document.getElementById("x0").value; var x1 = document.getElementById("x1").value; var x2 = document.getElementById("x2").value; var x3 = document.getElementById("x3").value; var x4 = document.getElementById("x4").value; var y0 = document.getElementById("y0").value; var y1 = document.getElementById("y1").value; var y2 = document.getElementById("y2").value; var y3 = document.getElementById("y3").value; var y4 = document.getElementById("y4").value; var z0 = document.getElementById("z0").value; var z1 = document.getElementById("z1").value; var z2 = document.getElementById("z2").value; var z3 = document.getElementById("z3").value; var z4 = document.getElementById("z4").value; var offset_x1 = (x0 - x1).toFixed(2); var offset_x2 = (x0 - x2).toFixed(2); var offset_x3 = (x0 - x3).toFixed(2); var offset_x4 = (x0 - x4).toFixed(2); var offset_y1 = (y0 - y1).toFixed(2); var offset_y2 = (y0 - y2).toFixed(2); var offset_y3 = (y0 - y3).toFixed(2); var offset_y4 = (y0 - y4).toFixed(2); var offset_z1 = (z0 - z1).toFixed(2); var offset_z2 = (z0 - z2).toFixed(2); var offset_z3 = (z0 - z3).toFixed(2); var offset_z4 = (z0 - z4).toFixed(2); var divider1 = " / "; var divider2 = " / "; var divider3 = " / "; if (x1 == "") { offset_x1 = ""; offset_y1 = ""; } if (x2 == "") { offset_x2 = ""; offset_y2 = ""; divider1 = ""; } if (x3 == "") { offset_x3 = ""; offset_y3 = ""; divider2 = ""; } if (x4 == "") { offset_x4 = ""; offset_y4 = ""; divider3 = ""; } var dividerZ1 = " / "; var dividerZ2 = " / "; var dividerZ3 = " / "; if (z1 == "") { offset_z1 = ""; } if (z2 == "") { offset_z2 = ""; dividerZ1 = ""; } if (z3 == "") { offset_z3 = ""; dividerZ2 = ""; } if (z4 == "") { offset_z4 = ""; dividerZ3 = ""; } var calibrationX_results = offset_x1 + divider1 + offset_x2 + divider2 + offset_x3 + divider3 + offset_x4; var calibrationY_results = offset_y1 + divider1 + offset_y2 + divider2 + offset_y3 + divider3 + offset_y4; var calibrationZ_results = offset_z1 + dividerZ1 + offset_z2 + dividerZ2 + offset_z3 + dividerZ3 + offset_z4; document.getElementById("calibrationX").value = calibrationX_results; document.getElementById("calibrationY").value = calibrationY_results; document.getElementById("calibrationZ").value = calibrationZ_results; debugOutput(calibrationX_results); debugOutput(calibrationY_results); debugOutput(calibrationZ_results); } function zoomIn() { if (currentZoomValue <3) { currentZoomValue += 0.5; } document.getElementById("videoStream").style.transform = "scale("+currentZoomValue+")"; } function zoomOut() { if (currentZoomValue >1) { currentZoomValue -= 0.5; } document.getElementById("videoStream").style.transform = "scale("+currentZoomValue+")"; } function exposureHandler() { var brightnessValue = (document.getElementById("exposureSlider").value)/10.00; document.getElementById("videoStream").style.filter = "brightness("+brightnessValue+")"; } function setTwoNumberDecimal(input) { input.value = parseFloat(input.value).toFixed(2); } function startHandler() { if (currentState == 0) { document.getElementById("backButton").disabled = false; document.getElementById("resetButton").disabled = false; document.getElementById("startButton").innerHTML = "Continue"; document.getElementById("startButtonZ").disabled = true; } currentState++; calibrationType = 0; stateHandler(); } function startHandlerZ() { if (currentState == 0) { document.getElementById("backButton").disabled = false; document.getElementById("resetButton").disabled = false; document.getElementById("startButtonZ").innerHTML = "Continue"; document.getElementById("startButton").disabled = true; } currentState++; calibrationType = 1; stateHandler(); } function backHandler() { currentState--; stateHandler(); } function resetHandler() { currentState = 0; stateHandler(); } function stateHandler() { switch (currentState) { case 0: document.getElementById("startButton").innerHTML = "Start XY Cal"; document.getElementById("startButtonZ").innerHTML = "Start Z Cal"; document.getElementById("textBox").innerHTML = ""; document.getElementById("startButton").disabled = false; document.getElementById("startButtonZ").disabled = false; document.getElementById("backButton").disabled = true; document.getElementById("resetButton").disabled = true; document.getElementById("x0").value = ""; document.getElementById("x1").value = ""; document.getElementById("x2").value = ""; document.getElementById("x3").value = ""; document.getElementById("x4").value = ""; document.getElementById("y0").value = ""; document.getElementById("y1").value = ""; document.getElementById("y2").value = ""; document.getElementById("y3").value = ""; document.getElementById("y4").value = ""; document.getElementById("z0").value = ""; document.getElementById("z1").value = ""; document.getElementById("z2").value = ""; document.getElementById("z3").value = ""; document.getElementById("z4").value = ""; document.getElementById("calibrationX").value = ""; document.getElementById("calibrationY").value = ""; document.getElementById("calibrationZ").value = ""; break; case 1: document.getElementById("textBox").innerHTML = "You MUST clear existing machine offset values for calibration to be accurate.<br><br>You MUST home the machine AFTER any changes to machine offset values.<br><br>Order of operations is CRITICAL, follow instructions carefully.<br><br>Ensure your CXC is STABLE and does NOT MOVE during calibration."; break; case 2: document.getElementById("textBox").innerHTML = "Clean nozzles - heat to 200C+ and wipe with brass/stainless brush.<br><br>Backup current calibration values and then set to zero."; break; case 3: document.getElementById("textBox").innerHTML = "Home the machine.<br><br>Move the Z axis up to 30mm (V1) or 40mm (V2)."; break; case 4: if (calibrationType == 0) { document.getElementById("textBox").innerHTML = "Place the CXC on the bed and drive T0 until visible.<br><br>Rotate the lens to focus the camera and adjust exposure if required."; } else { document.getElementById("textBox").innerHTML = "Place the CXC on the bed and drive T0 to the center of the Z probe."; } break; case 5: if (calibrationType == 0) { document.getElementById("textBox").innerHTML = "Move T0 until centered in the crosshair.<br><br>Enter the absolute X and Y position into the fields below."; } else { document.getElementById("textBox").innerHTML = "SLOWLY drop the Z height for T0 down until the probe is pressed and LEDs turn off.<br><br>Enter the absolute XYZ position into the fields below.<br>The XY position is just a reference for next steps."; } break; case 6: if (calibrationType == 0) { document.getElementById("textBox").innerHTML = "Home T0 and move T1 to the position previously recorded."; } else { document.getElementById("textBox").innerHTML = "Move the Z axis back to 30mm (V1) or 40mm (V2).<br><br>Home T0 and move T1 to the XY position previously recorded."; } break; case 7: if (calibrationType == 0) { document.getElementById("textBox").innerHTML = "Move T1 until centered in the crosshair.<br><br>Enter the absolute X and Y position into the fields below.<br><br>Repeat for remaining extruders if any."; document.getElementById("startButton").disabled = false; document.getElementById("calibrationX").value = ""; document.getElementById("calibrationY").value = ""; } else { document.getElementById("textBox").innerHTML = "SLOWLY drop the Z height for T1 down until the probe is pressed and LEDs turn off.<br><br>Enter the absolute Z position into the fields below.<br><br>Repeat for remaining extruders if any."; document.getElementById("startButtonZ").disabled = false; document.getElementById("calibrationZ").value = ""; } break; case 8: calculateOffsets(); document.getElementById("textBox").innerHTML = "CALIBRATION COMPLETE!<br><br>Enter the offset values into your printer or slicer.<br><br>If you are having trouble calibrating, check our user manual for troubleshooting."; document.getElementById("startButton").disabled = true; document.getElementById("startButtonZ").disabled = true; document.getElementById("backButton").disabled = false; document.getElementById("resetButton").disabled = false; break; } } var currentZoomValue = 1; var currentState = 0; var calibrationType = 0; cameraConnect(); </script></body></html>
